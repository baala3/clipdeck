[workspace]
resolver = "2"
members = [
    "crates/clip-engine",
    "crates/clip-windows",
    "crates/clip-macos",
    "crates/clip-linux",
    "crates/clipdeck-app",
]
# clipdeck-app needs a native GUI toolchain for whatever OS it targets (on Linux
# GTK and WebKitGTK), so plain `cargo build`/`cargo test`
# cover just the members that build anywhere. Build and test clipdeck-app
# explicitly with `-p clipdeck-app`.
default-members = [
    "crates/clip-engine",
    "crates/clip-windows",
    "crates/clip-macos",
    "crates/clip-linux",
]
