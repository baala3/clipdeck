[package]
name = "clip-macos"
version = "0.1.0"
edition = "2021"

[dependencies]
clip-engine = { path = "../clip-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSEnumerator", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSEvent", "NSPasteboard", "NSRunningApplication", "NSWorkspace"] }
