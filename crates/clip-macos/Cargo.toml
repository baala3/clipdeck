[package]
name = "clip-macos"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clip-engine = { path = "../clip-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "libc"] }
core-foundation = "0.10"
core-graphics = "0.25"
