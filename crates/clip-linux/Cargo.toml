[package]
name = "clip-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clip-engine = { path = "../clip-engine" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["res", "xfixes", "xtest"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["res", "xfixes", "xtest"] }
