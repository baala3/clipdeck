<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Clipdeck</title>
<link rel="stylesheet" href="glass-menu.css" />
</head>
<body>
<div class="pane cascade" id="cascade" role="menu"></div>

<script src="glass-menu.js"></script>
<script>
// A cascade of the glass menu (ADR-0015): a folder, More, a Clip's actions,
// or its full text or picture, beside the row it belongs to. It never has
// the keyboard; menu.html decides what it shows and highlights, and it only
// reports the mouse back.
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
// The pane on show. A new one is built out of sight, placed, then swapped in.
let pane = document.getElementById('cascade');

let content = null;
let rows = [];
let highlighted = -1;
// Whether the window is on screen. Hidden, it takes its new content before
// it shows; showing, it moves and resizes first, so it never shows the new
// content in the old box, or the old content in the new one.
let onScreen = false;

const report = (type, index, e) => invoke('cascade_input', {
  input: {
    type,
    index,
    held: e && {
      commandOrControl: content.platform === 'macos' ? e.metaKey : e.ctrlKey,
      alt: e.altKey,
      shift: e.shiftKey,
    },
  },
});

// Fills `next` with `shown`'s rows or preview; returns its rows by index.
// An image's picture is loaded before this returns, so the cascade appears
// once, at its final size.
async function render(next, shown) {
  const built = [];
  for (const item of shown.rows) {
    if (!item) { next.append(GlassMenu.separator()); continue; }
    const node = GlassMenu.row((node) => {
      if (item.kind === 'clip') GlassMenu.fillClip(node, item.clip);
      else GlassMenu.fillCommand(node, item.title, item.checked);
      if (item.checked !== undefined && item.checked !== null) {
        node.setAttribute('role', 'menuitemcheckbox');
        node.setAttribute('aria-checked', String(item.checked));
      }
      if (item.disabled) node.setAttribute('aria-disabled', 'true');
      if (item.danger) node.classList.add('danger');
    });
    if (item.index >= 0) {
      node.addEventListener('mouseenter', () => report('enter', item.index));
      node.addEventListener('click', (e) => report('click', item.index, e));
      node.addEventListener('contextmenu', () => report('menu', item.index));
      built[item.index] = node;
    }
    next.append(node);
  }
  const { preview } = shown;
  if (preview?.text) next.append(GlassMenu.el('div', 'preview-text', preview.text));
  if (preview?.imageId) {
    const url = await invoke('menu_preview', { id: preview.imageId });
    if (url) {
      const picture = GlassMenu.el('img', 'preview-image');
      picture.alt = preview.title;
      picture.src = url;
      next.append(picture);
      await picture.decode().catch(() => {});
    }
  }
  return built;
}

listen('cascade-open', async ({ payload }) => {
  content = payload;
  const shown = payload;
  document.documentElement.className = shown.platform;
  // Built beside the pane on show, out of sight, so nothing changes on
  // screen until the window has its new place and size.
  const next = GlassMenu.el('div', 'pane cascade');
  next.setAttribute('role', 'menu');
  next.style.width = shown.preview?.text !== undefined ? 'max-content' : `${shown.width}px`;
  next.style.maxWidth = `${shown.width}px`;
  next.style.position = 'absolute';
  next.style.visibility = 'hidden';
  document.body.append(next);
  const built = await render(next, shown);
  if (content !== shown) { next.remove(); return; }
  const box = next.getBoundingClientRect();
  const size = { width: Math.ceil(box.width), height: Math.ceil(box.height) };
  const swap = () => {
    next.style.position = '';
    next.style.visibility = '';
    next.addEventListener('mouseenter', () => content && report('hover', -1));
    pane.replaceWith(next);
    pane = next;
    rows = built;
    rows.forEach((node, i) => node?.classList.toggle('on', i === highlighted));
  };
  if (!onScreen) swap();
  await invoke('cascade_shown', size);
  onScreen = true;
  if (content !== shown) { if (next !== pane) next.remove(); return; }
  if (next !== pane) swap();
});

listen('cascade-hidden', () => { onScreen = false; });

listen('cascade-highlight', ({ payload: index }) => {
  highlighted = index;
  rows.forEach((node, i) => node?.classList.toggle('on', i === index));
});
</script>
</body>
</html>
