<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Clipdeck</title>
<link rel="stylesheet" href="glass-menu.css" />
</head>
<body>
<div class="pane cascade" id="cascade" role="menu"></div>

<script src="glass-menu.js"></script>
<script>
// A cascade of the glass menu (ADR-0015): a folder, More, a Clip's actions,
// or its full text or picture, beside the row it belongs to. It never has
// the keyboard; menu.html decides what it shows and highlights, and it only
// reports the mouse back.
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const pane = document.getElementById('cascade');

let content = null;
let rows = [];

const report = (type, index, e) => invoke('cascade_input', {
  input: {
    type,
    index,
    held: e && {
      commandOrControl: content.platform === 'macos' ? e.metaKey : e.ctrlKey,
      alt: e.altKey,
      shift: e.shiftKey,
    },
  },
});

function render() {
  pane.replaceChildren();
  rows = [];
  for (const item of content.rows) {
    if (!item) { pane.append(GlassMenu.separator()); continue; }
    const node = GlassMenu.row((node) => {
      if (item.kind === 'clip') GlassMenu.fillClip(node, item.clip);
      else GlassMenu.fillCommand(node, item.title, item.checked);
      if (item.checked !== undefined && item.checked !== null) {
        node.setAttribute('role', 'menuitemcheckbox');
        node.setAttribute('aria-checked', String(item.checked));
      }
      if (item.disabled) node.setAttribute('aria-disabled', 'true');
      if (item.danger) node.classList.add('danger');
    });
    if (item.index >= 0) {
      node.addEventListener('mouseenter', () => report('enter', item.index));
      node.addEventListener('click', (e) => report('click', item.index, e));
      node.addEventListener('contextmenu', () => report('menu', item.index));
      rows[item.index] = node;
    }
    pane.append(node);
  }
  const { preview } = content;
  if (preview?.text) pane.append(GlassMenu.el('div', 'preview-text', preview.text));
  if (preview?.imageId) {
    const loading = GlassMenu.el('div', 'preview-loading', 'Loading...');
    pane.append(loading);
    const shown = content;
    invoke('menu_preview', { id: preview.imageId }).then((url) => {
      if (content !== shown || !url) return;
      const picture = GlassMenu.el('img', 'preview-image');
      picture.alt = preview.title;
      picture.onload = place;
      picture.src = url;
      loading.replaceWith(picture);
    });
  }
}

// Sized to what it shows, up to its width; then placed beside its row.
function place() {
  const box = pane.getBoundingClientRect();
  invoke('cascade_shown', { width: Math.ceil(box.width), height: Math.ceil(box.height) });
}

listen('cascade-open', ({ payload }) => {
  content = payload;
  document.documentElement.className = content.platform;
  const fits = content.preview?.text !== undefined;
  pane.style.width = fits ? 'max-content' : `${content.width}px`;
  pane.style.maxWidth = `${content.width}px`;
  render();
  place();
});

listen('cascade-highlight', ({ payload: index }) => {
  rows.forEach((node, i) => node?.classList.toggle('on', i === index));
});

// The pointer is over the cascade: the menu keeps it open.
pane.addEventListener('mouseenter', () => content && report('hover', -1));
</script>
</body>
</html>
