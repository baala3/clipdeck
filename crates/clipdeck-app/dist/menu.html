<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Clipdeck</title>
<style>
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 700; font-display: block; src: url(fonts/jetbrains-mono.woff2) format("woff2"); }

  /* The glass menu (ADR-0015). On Windows and macOS the OS blurs whatever
     is behind the window (Acrylic, Liquid Glass) and this page only tints
     it; X11 has no such effect, so on Linux the page paints the glass itself.
     Colors follow the website's and Settings' glass tokens. */
  :root {
    color-scheme: light dark;
    --c-light: #ffffff;
    --c-dark: #1b2138;
    --c-content: #2c3557;
    --c-action: #6d5dfc;
    --c-bg: #e4ebf5;
    --tint: color-mix(in srgb, #f4f7fc 58%, transparent);
    --chip: color-mix(in srgb, #ffffff 62%, transparent);
    --highlight: color-mix(in srgb, #6d5dfc 16%, transparent);
    --orb-1: #8abdff;
    --orb-2: #a99ffd;
    --orb-3: #c8d0e7;
    --badge-bg: color-mix(in srgb, #ffcc4d 45%, transparent);
    --badge-text: #8a5a00;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --c-light: #e4ebf5;
      --c-dark: #0b0e1a;
      --c-content: #e4ebf5;
      --c-action: #8abdff;
      --c-bg: #1b2138;
      --tint: color-mix(in srgb, #1b2138 58%, transparent);
      --chip: color-mix(in srgb, #9baacf 16%, transparent);
      --highlight: color-mix(in srgb, #8abdff 22%, transparent);
      --orb-1: #5b0eeb;
      --orb-2: #6d5dfc;
      --orb-3: #232a45;
      --badge-bg: color-mix(in srgb, #ffcc4d 22%, transparent);
      --badge-text: #ffd98a;
      --danger: #ffb4ab;
    }
  }
  :root {
    --muted: color-mix(in srgb, var(--c-content) 64%, var(--c-bg));
    --hairline: color-mix(in srgb, var(--c-content) 11%, transparent);
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, monospace;
    --list-width: 300px;
    --panel-width: 320px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    color: var(--c-content);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }

  #menu { display: inline-flex; align-items: stretch; background: var(--tint); }
  #menu.panel-left { flex-direction: row-reverse; }
  .macos #menu { border-radius: 14px; }
  /* Linux: no OS blur behind the window, so the page draws a soft glass of its own. */
  .linux #menu {
    background:
      radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--orb-1) 38%, transparent), transparent 60%),
      radial-gradient(100% 80% at 100% 30%, color-mix(in srgb, var(--orb-2) 30%, transparent), transparent 60%),
      radial-gradient(90% 70% at 40% 100%, color-mix(in srgb, var(--orb-3) 45%, transparent), transparent 65%),
      var(--c-bg);
  }

  .list, .panel { flex: none; padding: 6px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .list { width: var(--list-width); outline: none; }
  .panel { width: var(--panel-width); border-left: 1px solid var(--hairline); }
  .panel-left .panel { border-left: none; border-right: 1px solid var(--hairline); }
  .panel[hidden] { display: none; }

  .heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 4px; font: 600 10.5px/1 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  /* A Clip's own text keeps its case. */
  .heading.clip-heading { text-transform: none; letter-spacing: 0; font: 600 11.5px/1.2 system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .badge { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.02em; text-transform: none; color: var(--badge-text); background: var(--badge-bg); padding: 3px 6px; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 8px; border-radius: 9px; white-space: nowrap; }
  .row.on { background: var(--highlight); }
  .row[aria-disabled="true"] { color: var(--muted); opacity: 0.6; }
  .row.danger { color: var(--danger); }
  .row.notice { color: var(--c-action); font-weight: 600; white-space: normal; height: auto; min-height: 30px; padding-block: 6px; }
  .num { width: 18px; flex: none; text-align: right; font: 500 11px/1 var(--mono); color: var(--muted); }
  .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .key { flex: none; font: 500 10.5px/1 var(--mono); color: var(--muted); padding: 3px 5px; border-radius: 5px; background: var(--chip); }
  .thumb { width: 34px; height: 20px; flex: none; object-fit: cover; border-radius: 5px; box-shadow: 0 0 0 1px var(--hairline); }
  .chevron, .check { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .chevron { margin-left: auto; color: var(--muted); }
  .panel-left .row .chevron { transform: scaleX(-1); }
  .sep { height: 1px; background: var(--hairline); margin: 5px 8px; }
  .empty { padding: 4px 10px 6px 34px; color: var(--muted); }

  .preview-text { margin: 4px 6px 6px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
  .preview-image { display: block; margin: 4px auto 6px; max-width: 100%; max-height: 240px; border-radius: 8px; box-shadow: 0 0 0 1px var(--hairline); }
  .preview-loading { margin: 12px 10px; color: var(--muted); }
</style>
</head>
<body>
<div id="menu">
  <div class="list" id="list" role="menu" aria-label="Clipdeck" tabindex="0"></div>
  <div class="panel" id="panel" role="menu" hidden></div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const menu = document.getElementById('menu');
const list = document.getElementById('list');
const panel = document.getElementById('panel');

// How long the pointer rests before a folder opens, or a Clip's full text
// or picture shows, and before the panel closes again; like native menus.
const OPEN_DELAY = 150;
const PREVIEW_DELAY = 450;
const CLOSE_DELAY = 300;

let model = null;
let panelOnLeft = false;
// Rows the keyboard moves through, per pane, and which one is highlighted.
let rows = { list: [], panel: [] };
let pane = 'list';
let index = -1;
// What the side panel shows: null, or { owner, kind, clip } where owner is
// the list row it belongs to, kind is 'folder', 'more', 'actions' or
// 'preview', and clip is whose actions or preview it is. A folder's Clip has
// its actions there too, with `inFolder` set so Left goes back to the folder.
let side = null;
let timer = null;

const svg = (className, path) =>
  `<svg class="${className}" viewBox="0 0 12 12" aria-hidden="true"><path d="${path}"/></svg>`;
const CHEVRON = svg('chevron', 'M4.5 2.5 8 6l-3.5 3.5');
const CHECK = svg('check', 'M2 6.5 4.8 9 10 3');

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function held(e) {
  return {
    commandOrControl: model.platform === 'macos' ? e.metaKey : e.ctrlKey,
    alt: e.altKey,
    shift: e.shiftKey,
  };
}

// --- Building rows

let nextId = 0;
function rowNode(pane, data, build) {
  const row = el('div', 'row');
  row.id = `row-${nextId++}`;
  row.setAttribute('role', 'menuitem');
  row.data = data;
  build(row);
  row.addEventListener('mouseenter', () => hover(pane, row));
  row.addEventListener('click', (e) => choose(row, e));
  if (data.clip) {
    row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showActions(pane, row);
    });
  }
  return row;
}

function clipRow(pane, clip) {
  return rowNode(pane, { clip }, (row) => {
    row.append(el('span', 'num', clip.number ?? ''));
    if (clip.thumbnail) {
      const thumb = el('img', 'thumb');
      thumb.src = clip.thumbnail;
      thumb.alt = '';
      row.append(thumb);
    }
    row.append(el('span', 'title', clip.title));
    if (clip.shortcut) row.append(el('span', 'key', clip.shortcut));
  });
}

function folderRow(title, data) {
  return rowNode('list', data, (row) => {
    row.setAttribute('aria-haspopup', 'menu');
    row.append(el('span', 'num'), el('span', 'title', title));
    row.insertAdjacentHTML('beforeend', CHEVRON);
  });
}

function render() {
  nextId = 0;
  list.replaceChildren();
  rows = { list: [], panel: [] };
  const add = (node) => {
    list.append(node);
    if (node.classList.contains('row') && node.getAttribute('aria-disabled') !== 'true') rows.list.push(node);
  };

  if (model.pastingOff) {
    const notice = rowNode('list', { command: 'allow_pasting' }, (row) => {
      row.classList.add('notice');
      row.textContent = 'Pasting is off. Allow it in Accessibility settings';
    });
    add(notice);
    add(el('div', 'sep'));
  }

  model.sections.forEach((section, i) => {
    if (i > 0) add(el('div', 'sep'));
    const heading = el('div', 'heading', section.title);
    if (i === 0 && model.paused) heading.append(el('span', 'badge', 'Capture paused'));
    add(heading);
    if (section.entries.length === 0) add(el('div', 'empty', 'Empty'));
    for (const entry of section.entries) {
      if (entry.type === 'clip') add(clipRow('list', entry));
      else add(folderRow(entry.title, { folder: entry }));
    }
  });

  add(el('div', 'sep'));
  add(folderRow('More', { more: true }));
}

function fillPanel(owner, kind, clip) {
  panel.replaceChildren();
  rows.panel = [];
  const add = (node) => {
    panel.append(node);
    if (node.classList.contains('row') && node.getAttribute('aria-disabled') !== 'true') rows.panel.push(node);
  };
  const { folder } = owner.data;
  if (kind === 'folder') {
    panel.setAttribute('aria-label', folder.title);
    add(el('div', 'heading', folder.title));
    folder.rows.forEach((row) => add(clipRow('panel', row)));
  } else if (kind === 'more') {
    panel.setAttribute('aria-label', 'More');
    add(el('div', 'heading', 'More'));
    for (const command of model.more) {
      if (!command) { add(el('div', 'sep')); continue; }
      add(rowNode('panel', { command: command.id }, (row) => {
        row.append(el('span', 'num'));
        if (command.checked) row.firstChild.innerHTML = CHECK;
        row.append(el('span', 'title', command.label));
        if (command.checked !== null) row.setAttribute('role', 'menuitemcheckbox');
        if (command.checked !== null) row.setAttribute('aria-checked', String(command.checked));
        if (!command.enabled) row.setAttribute('aria-disabled', 'true');
      }));
    }
  } else if (kind === 'actions') {
    panel.setAttribute('aria-label', `Actions for ${clip.title}`);
    add(el('div', 'heading clip-heading', clip.title));
    for (const action of clip.actions) {
      add(rowNode('panel', { action, of: clip.id }, (row) => {
        if (action === 'Delete') row.classList.add('danger');
        row.append(el('span', 'num'), el('span', 'title', action));
      }));
    }
  } else if (kind === 'preview') {
    panel.setAttribute('aria-label', clip.title);
    add(el('div', 'heading', clip.image ? clip.title : 'Full text'));
    if (clip.image) {
      const loading = el('div', 'preview-loading', 'Loading...');
      add(loading);
      invoke('menu_preview', { id: clip.id }).then((url) => {
        if (side?.owner !== owner || !url) return;
        const picture = el('img', 'preview-image');
        picture.alt = clip.title;
        picture.onload = resize;
        picture.src = url;
        loading.replaceWith(picture);
      });
    } else {
      add(el('div', 'preview-text', clip.tooltip));
    }
  }
}

// --- The side panel

function sideKind(row) {
  const { clip, folder, more } = row.data;
  if (folder) return 'folder';
  if (more) return 'more';
  if (clip && (clip.image || clip.tooltip)) return 'preview';
  return null;
}

function openPanel(owner, kind, clip = owner.data.clip, inFolder = false) {
  clearTimeout(timer);
  if (side && side.owner === owner && side.kind === kind && side.clip === clip) return;
  side = { owner, kind, clip, inFolder };
  fillPanel(owner, kind, clip);
  panel.hidden = false;
  resize();
}

// A Clip's actions (ADR-0011), from a right-click or the arrow key toward the panel.
function showActions(inPane, row) {
  if (inPane === 'panel') {
    openPanel(side.owner, 'actions', row.data.clip, true);
  } else {
    highlight('list', rows.list.indexOf(row));
    openPanel(row, 'actions');
  }
  if (rows.panel.length) highlight('panel', 0);
}

// Back out of the panel one step: from a folder Clip's actions to the
// folder, otherwise to the list.
function back() {
  const { owner, inFolder, clip } = side;
  if (inFolder) {
    openPanel(owner, 'folder');
    highlight('panel', rows.panel.findIndex((row) => row.data.clip?.id === clip.id));
    return;
  }
  closePanel();
  highlight('list', rows.list.indexOf(owner));
}

function closePanel() {
  clearTimeout(timer);
  if (!side) return;
  side = null;
  panel.hidden = true;
  rows.panel = [];
  if (pane === 'panel') { pane = 'list'; index = rows.list.indexOf(document.querySelector('.list .row.on')); }
  resize();
}

// --- Highlight, hover and keys

function highlight(newPane, newIndex) {
  document.querySelectorAll('.row.on').forEach((row) => {
    if (newPane === 'list' || !row.closest('.list')) row.classList.remove('on');
  });
  pane = newPane;
  index = newIndex;
  const row = rows[pane][index];
  if (!row) return;
  row.classList.add('on');
  list.setAttribute('aria-activedescendant', row.id);
  row.scrollIntoView({ block: 'nearest' });
}

function hover(inPane, row) {
  const i = rows[inPane].indexOf(row);
  if (i < 0) return;
  highlight(inPane, i);
  clearTimeout(timer);
  if (inPane === 'panel') return;
  const kind = sideKind(row);
  if (side && side.owner === row) return;
  if (kind === 'folder' || kind === 'more') {
    timer = setTimeout(() => openPanel(row, kind), OPEN_DELAY);
  } else if (kind === 'preview') {
    timer = setTimeout(() => openPanel(row, kind), side ? OPEN_DELAY : PREVIEW_DELAY);
  } else if (side) {
    timer = setTimeout(closePanel, CLOSE_DELAY);
  }
}
panel.addEventListener('mouseenter', () => clearTimeout(timer));

function move(step) {
  const count = rows[pane].length;
  if (count === 0) return;
  const next = index < 0 ? (step > 0 ? 0 : count - 1) : (index + step + count) % count;
  highlight(pane, next);
  if (pane === 'list' && side && side.owner !== rows.list[next]) closePanel();
}

function choose(row, e) {
  const { clip, folder, more, command, action, of } = row.data;
  if (row.getAttribute('aria-disabled') === 'true') return;
  if (clip) invoke('menu_choose', { id: clip.id, held: held(e) });
  else if (folder) openPanel(row, 'folder');
  else if (more) openPanel(row, 'more');
  else if (command) invoke('menu_command', { command });
  else if (action) invoke('menu_action', { id: of, action });
}

function enterPanel(row, kind) {
  openPanel(row, kind);
  if (rows.panel.length) highlight('panel', 0);
}

window.addEventListener('keydown', (e) => {
  if (!model) return;
  const row = rows[pane][index];
  const toward = panelOnLeft ? 'ArrowLeft' : 'ArrowRight';
  const away = panelOnLeft ? 'ArrowRight' : 'ArrowLeft';
  if (e.key === 'ArrowDown') move(1);
  else if (e.key === 'ArrowUp') move(-1);
  else if (e.key === 'Home') highlight(pane, 0);
  else if (e.key === 'End') highlight(pane, rows[pane].length - 1);
  else if (e.key === toward && row) {
    const kind = sideKind(row);
    if (pane === 'list' && (kind === 'folder' || kind === 'more')) enterPanel(row, kind);
    else if (row.data.clip && (pane === 'list' || side.kind === 'folder')) showActions(pane, row);
  } else if ((e.key === away || e.key === 'Escape') && side) back();
  else if (e.key === 'Escape') invoke('menu_dismiss');
  else if ((e.key === 'Enter' || e.key === ' ') && row) {
    if (row.data.folder || row.data.more) enterPanel(row, row.data.folder ? 'folder' : 'more');
    else choose(row, e);
  } else if (/^(Digit|Numpad)[0-9]$/.test(e.code)) {
    invoke('menu_digit', { digit: e.code.slice(-1), held: held(e) });
  } else if (e.key !== 'Tab') return;
  e.preventDefault();
});
window.addEventListener('contextmenu', (e) => e.preventDefault());

// --- Size and placement

function size() {
  const max = model.maxHeight;
  list.style.maxHeight = panel.style.maxHeight = `${max}px`;
  const listHeight = Math.min(list.scrollHeight, max);
  const panelHeight = side ? Math.min(panel.scrollHeight, max) : 0;
  return {
    width: Math.ceil(menu.getBoundingClientRect().width),
    height: Math.ceil(Math.max(listHeight, panelHeight)),
  };
}

function resize() {
  if (!model) return;
  invoke('menu_resize', size());
}

listen('menu-open', async (event) => {
  model = event.payload;
  side = null;
  pane = 'list';
  index = -1;
  clearTimeout(timer);
  panel.hidden = true;
  menu.classList.remove('panel-left');
  document.documentElement.className = model.platform;
  render();
  list.scrollTop = 0;
  panelOnLeft = await invoke('menu_shown', size());
  menu.classList.toggle('panel-left', panelOnLeft);
  list.focus();
});
</script>
</body>
</html>
