[package]
name = "clipdeck-app"
version = "0.7.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
clip-engine = { path = "../clip-engine" }
# macos-private-api: a see-through window, for the glass menu's Liquid Glass.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
auto-launch = "0.6"

[target.'cfg(windows)'.dependencies]
clip-windows = { path = "../clip-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
clip-macos = { path = "../clip-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
clip-linux = { path = "../clip-linux" }
# The same GTK that Tauri uses, to find the glass menu's X11 window.
gtk = "0.18"
gdkx11 = "0.18"
